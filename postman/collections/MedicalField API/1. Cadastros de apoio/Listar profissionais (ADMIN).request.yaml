$kind: http-request
url: "{{baseUrl}}/auth/profissional"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('200 (admin) ou 403', () => pm.expect([200,403]).to.include(pm.response.code));
    language: text/javascript
order: 3000
