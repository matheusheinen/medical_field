$kind: http-request
url: "{{baseUrl}}/medicamento"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json(); if (j.length) pm.collectionVariables.set('medicamentoId', j.find(m => m.nome.startsWith('Glicose'))?.id ?? j[0].id);
    language: text/javascript
order: 1000
