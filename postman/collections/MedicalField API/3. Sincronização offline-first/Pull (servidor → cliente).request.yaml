$kind: http-request
description: Retorna tudo que mudou desde 'desde'. Sem o parâmetro, retorna tudo.
url: "{{baseUrl}}/sync/pull?desde=2026-01-01T00:00:00.000Z"
method: GET
queryParams:
  desde: 2026-01-01T00:00:00.000Z
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
