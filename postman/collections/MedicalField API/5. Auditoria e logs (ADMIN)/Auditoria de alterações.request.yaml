$kind: http-request
url: "{{baseUrl}}/auditoria?limite=50"
method: GET
queryParams:
  limite: "50"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
