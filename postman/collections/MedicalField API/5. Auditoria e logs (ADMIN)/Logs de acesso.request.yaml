$kind: http-request
url: "{{baseUrl}}/log?limite=100"
method: GET
queryParams:
  limite: "100"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
