$kind: http-request
url: "{{baseUrl}}/auditoria?entidadeId={{prontuarioId}}"
method: GET
queryParams:
  entidadeId: "{{prontuarioId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
