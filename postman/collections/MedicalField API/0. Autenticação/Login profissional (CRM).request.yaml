$kind: http-request
description: Única rota pública. Salva o token na variável {{token}}.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipoRegistro": "CRM",
      "registro": "12345",
      "senha": "senha123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json(); pm.collectionVariables.set('token', j.token);
    language: text/javascript
order: 1000
