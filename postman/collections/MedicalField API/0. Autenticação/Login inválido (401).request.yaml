$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipoRegistro": "CRM",
      "registro": "12345",
      "senha": "errada"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
