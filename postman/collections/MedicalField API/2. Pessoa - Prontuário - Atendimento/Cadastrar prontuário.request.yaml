$kind: http-request
url: "{{baseUrl}}/prontuario"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{prontuarioId}}",
      "pessoaId": "{{pessoaId}}",
      "tipoSanguineo": "AB+",
      "alergias": "Dipirona",
      "comorbidades": "Diabetes tipo 2",
      "versao": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
