$kind: http-request
url: "{{baseUrl}}/atendimento"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{atendimentoId}}",
      "prontuarioId": "{{prontuarioId}}",
      "pessoaId": "{{pessoaId}}",
      "dataHora": "2026-11-10T14:30:00.000Z",
      "localOcorrencia": "RS-287, km 45",
      "queixaPrincipal": "Hipoglicemia",
      "paSistolica": 110,
      "paDiastolica": 70,
      "freqCardiaca": 98,
      "freqRespiratoria": 18,
      "saturacaoO2": 97,
      "temperatura": 36.4,
      "glicemia": 45,
      "glasgowOcular": 3,
      "glasgowVerbal": 4,
      "glasgowMotora": 6,
      "glasgowTotal": 13,
      "triagemManchester": "AMARELO",
      "triagemStart": "VERDE",
      "procedimentos": "Acesso venoso periférico",
      "destino": "HSC Santa Cruz do Sul",
      "medicamentos": [
        {
          "medicamentoId": "{{medicamentoId}}",
          "dose": 20,
          "unidade": "mL",
          "via": "IV",
          "horario": "2026-11-10T14:35:00.000Z"
        }
      ],
      "versao": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 6000
