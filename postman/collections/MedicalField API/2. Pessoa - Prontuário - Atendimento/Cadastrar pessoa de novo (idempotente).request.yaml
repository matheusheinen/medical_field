$kind: http-request
description: "Mesmo Idempotency-Key: o servidor não regrava e devolve DUPLICADO."
url: "{{baseUrl}}/pessoa"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{opId}}"
body:
  type: json
  content: |-
    {
      "id": "{{pessoaId}}",
      "nome": "Paciente Postman",
      "cpf": "555.666.777-88",
      "dataNascimento": "1990-03-15",
      "sexo": "F",
      "email": "paciente@example.com",
      "contatoEmergenciaNome": "Familiar Postman",
      "contatoEmergenciaEmail": "familiar@example.com",
      "versao": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('DUPLICADO', () => pm.expect(pm.response.json().status).to.eql('DUPLICADO'));
    language: text/javascript
order: 2000
