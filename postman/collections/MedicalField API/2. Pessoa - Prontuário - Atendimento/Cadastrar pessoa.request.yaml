$kind: http-request
url: "{{baseUrl}}/pessoa"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{opId}}"
body:
  type: json
  content: |-
    {
      "id": "{{pessoaId}}",
      "nome": "Paciente Postman",
      "cpf": "555.666.777-88",
      "dataNascimento": "1990-03-15",
      "sexo": "F",
      "email": "paciente@example.com",
      "contatoEmergenciaNome": "Familiar Postman",
      "contatoEmergenciaEmail": "familiar@example.com",
      "versao": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('201 CRIADO', () => { pm.response.to.have.status(201); pm.expect(pm.response.json().status).to.eql('CRIADO'); });
    language: text/javascript
  - type: beforeRequest
    code: |-
      // gera ids novos (UUID) para pessoa/prontuário/atendimento/operação
      ['pessoaId','prontuarioId','atendimentoId','opId'].forEach(k => pm.collectionVariables.set(k, pm.variables.replaceIn('{{$guid}}')));
    language: text/javascript
order: 1000
