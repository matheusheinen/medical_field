# =====================================================================
# MedicalField - API Gateway + servidor das interfaces (Nginx)
# Copiar para /etc/nginx/sites-available/medicalfield e ativar:
#   sudo ln -s /etc/nginx/sites-available/medicalfield /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#
#   http://IP-DA-VM/admin/  -> Portal administrativo
#   http://IP-DA-VM/app/    -> Aplicação cliente (PWA)
#   http://IP-DA-VM/api/... -> microsserviços
# =====================================================================

upstream mf_auth      { server 127.0.0.1:3001; }   # Node.js / TypeScript
upstream mf_clinical  { server 127.0.0.1:8080; }   # Java 21
upstream mf_documento { server 127.0.0.1:8000; }   # Python / FastAPI

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    root /var/www/medicalfield;

    # Cabeçalhos repassados a todos os serviços (o IP real do cliente vai para os logs)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # CORS: permite rodar o app cliente em outra origem (ex.: http://localhost:4173 no notebook)
    set $cors_origin $http_origin;

    # ---------------- auth-service
    location /api/auth/ {
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Device-Id, Idempotency-Key" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        proxy_pass http://mf_auth/auth/;
    }

    # ---------------- document-service
    location /api/documento/ {
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Device-Id, Idempotency-Key" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        proxy_pass http://mf_documento/documento/;
    }

    # ---------------- clinical-service (demais rotas: /pessoa, /prontuario, /atendimento, /sync, /log...)
    location /api/ {
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Device-Id, Idempotency-Key" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        proxy_pass http://mf_clinical/;
    }

    # ---------------- interfaces gráficas (arquivos gerados por "npm run build")
    location = /app/sw.js { add_header Cache-Control "no-cache"; }
    location /app/   { try_files $uri $uri/ /app/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location = /     { return 302 /admin/; }
}
